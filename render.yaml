# render.yaml
# Purpose: Render Blueprint deployment config (production)
# Date: 2026-01-01

services:
  # Python / Flask backend API
  - type: web
    name: ledgerhaul-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 120 boot_server:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: APP_ENV
        value: production
      - key: BASE_URL
        value: https://ledgerhaul.com
      - key: PORT
        value: "10000"
      # Add the rest of your secrets in Render dashboard:
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, price IDs, DATABASE_URL, etc.

  # React / Vite frontend (static site)
  - type: web
    name: ledgerhaul-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html