# render.yaml
# Purpose: Render Blueprint deployment config (production)
# Date: 2026-01-01

services:
  - type: web
    name: freightpay
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: APP_ENV
        value: production
      - key: BASE_URL
        value: https://freightpay.onrender.com
      - key: PORT
        value: "10000"
      # Add the rest of your secrets in Render dashboard:
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, price IDs, DATABASE_URL, etc.
