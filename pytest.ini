# File: pytest.ini
# Purpose: Configure pytest discovery and coverage
# Status: Enterprise hardened
# Date: 2026-03-08

[pytest]

addopts =
    -ra
    -q
    --strict-markers
    --disable-warnings
    --cov=services
    --cov=models
    --cov-report=term-missing
    --cov-fail-under=7

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*