# File: .github/workflows/enterprise-quality.yml
# Commit: enable ruff auto-fix in CI and keep migration traceback visible

name: enterprise-quality

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  pull_request:
    branches:
      - "*"

jobs:
  enterprise-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerhaul_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ledgerhaul_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      FLASK_APP: wsgi:app
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledgerhaul_ci
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      GUSTO_CLIENT_ID: ci_gusto_client_id
      GUSTO_CLIENT_SECRET: ci_gusto_client_secret
      GUSTO_ENV: sandbox
      SENDGRID_API_KEY: SG.ci-placeholder
      TWILIO_ACCOUNT_SID: ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      TWILIO_AUTH_TOKEN: ci-twilio-token
      TWILIO_PHONE_NUMBER: "+15555550123"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d ledgerhaul_ci && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time."
          exit 1
        env:
          PGPASSWORD: postgres

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install ruff bandit pip-audit flask-migrate psycopg[binary] pytest

      - name: pip check
        run: |
          set -euo pipefail
          pip check

      - name: Ruff lint
        run: |
          set -euo pipefail
          ruff check . \
            --fix \
            --line-length 110 \
            --select E,F,W \
            --ignore E501,E741,E712,F401,F841,W291,W293
          ruff check . \
            --line-length 110 \
            --select E,F,W \
            --ignore E501,E741,E712,F401,F841,W291,W293

      - name: Bandit security scan
        run: |
          set -euo pipefail
          bandit -r . -x tests,migrations/versions -s B101,B104,B105,B106,B108,B110,B112,B311,B608

      - name: Dependency audit
        run: |
          set -euo pipefail
          pip-audit --progress-spinner off || pip-audit --progress-spinner off --ignore-vuln GHSA-w596-4wvx-j9j6

      - name: Database migration check
        run: |
          set -euo pipefail

          echo "DATABASE_URL_PRESENT=${DATABASE_URL:+True}"
          echo "DATABASE_URL_VALUE_MASKED=***localhost:5432/ledgerhaul_ci"

          python -X dev -m flask --app wsgi:app db upgrade

      - name: Verify tests directory exists
        run: |
          set -euo pipefail
          if [ ! -d tests ]; then
            echo "tests directory not found"
            exit 1
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Post Setup Python
        if: always()
        run: |
          python --version
          pip --version

      - name: Stop containers
        if: always()
        run: |
          docker ps -a || true

      - name: Complete job
        if: always()
        run: |
          echo "enterprise-quality workflow complete"
