<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — LedgerHaul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,211,159,0.1) 0%, transparent 60%), var(--bg); }
  </style>
</head>
<body>
  <div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:32px;">
      <a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul" style="height:36px;width:auto;margin:0 auto;"></a>
    </div>

    <div class="panel">
      <div style="text-align:center;margin-bottom:28px;">
        <h2 style="font-size:22px;font-weight:700;color:#FFF;margin-bottom:8px;">Choose a new password</h2>
        <p style="font-size:14px;color:var(--text-muted);">Make it strong — at least 8 characters.</p>
      </div>

      <div id="errorMsg" style="display:none;" class="alert alert-error" style="margin-bottom:16px;"></div>

      <form id="resetForm" style="display:flex;flex-direction:column;gap:18px;">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirm_password" placeholder="Repeat password" autocomplete="new-password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;justify-content:center;min-height:48px;">Set new password</button>
      </form>
    </div>

    <p style="text-align:center;font-size:14px;color:var(--text-muted);margin-top:20px;">
      <a href="login.html" style="color:var(--green);font-weight:500;">← Back to sign in</a>
    </p>
  </div>

<script>
  const API_BASE = (window.LH_CONFIG && window.LH_CONFIG.apiBase) ? window.LH_CONFIG.apiBase : '';
  const token = new URLSearchParams(window.location.search).get('token') || '';

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (password !== confirm) {
      errorMsg.style.display = 'flex';
      errorMsg.textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Updating…';

    try {
      const res = await fetch(API_BASE + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = 'login.html?reset=1';
      } else {
        errorMsg.style.display = 'flex';
        errorMsg.textContent = data.message || 'Reset failed. The link may have expired.';
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    } catch {
      errorMsg.style.display = 'flex';
      errorMsg.textContent = 'Unable to connect. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Set new password';
    }
  });
</script>
</body>
</html>
