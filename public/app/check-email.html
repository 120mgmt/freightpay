<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email — LedgerHaul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,211,159,0.1) 0%, transparent 60%), var(--bg); }
  </style>
</head>
<body>
  <div style="width:100%;max-width:440px;text-align:center;">
    <a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul" style="height:36px;width:auto;margin:0 auto 32px;"></a>

    <div class="panel" style="text-align:center;">
      <div style="width:64px;height:64px;background:rgba(56,211,159,0.1);border:1px solid rgba(56,211,159,0.25);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--green);">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>

      <h2 style="font-size:24px;font-weight:700;color:#FFF;margin-bottom:10px;">Check your inbox</h2>
      <p style="font-size:15px;color:var(--text-muted);line-height:1.7;margin-bottom:28px;">We've sent a verification link to your email address. Click the link to activate your account.</p>

      <div style="background:rgba(56,211,159,0.06);border:1px solid rgba(56,211,159,0.15);border-radius:12px;padding:16px;margin-bottom:24px;">
        <div style="font-size:13px;color:var(--text-subtle);">Didn't receive an email?</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">Check your spam folder, or <button onclick="resend()" style="color:var(--green);font-weight:600;background:none;border:none;cursor:pointer;font-size:13px;">resend the verification email</button>.</div>
      </div>

      <a href="login.html" class="btn btn-secondary" style="width:100%;justify-content:center;">Return to sign in</a>
    </div>
  </div>

<script>
  function resend() {
    const API_BASE = (window.LH_CONFIG && window.LH_CONFIG.apiBase) ? window.LH_CONFIG.apiBase : '';
    fetch(API_BASE + '/auth/resend-verification', { method: 'POST', headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('lh_token') || '') } });
    alert('Verification email resent!');
  }
</script>
</body>
</html>
