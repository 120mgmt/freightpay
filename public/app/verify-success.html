<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified — LedgerHaul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,211,159,0.12) 0%, transparent 60%), var(--bg); }
    @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 80% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    .icon-pop { animation: pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both; }
  </style>
</head>
<body>
  <div style="width:100%;max-width:440px;text-align:center;">
    <a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul" style="height:36px;width:auto;margin:0 auto 32px;"></a>

    <div class="panel" style="text-align:center;">
      <div class="icon-pop" style="width:72px;height:72px;background:rgba(56,211,159,0.15);border:2px solid rgba(56,211,159,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:var(--green);">
        <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>

      <h2 style="font-size:24px;font-weight:700;color:#FFF;margin-bottom:10px;">Email verified!</h2>
      <p style="font-size:15px;color:var(--text-muted);line-height:1.7;margin-bottom:28px;">Your account is now active. You're ready to start running settlements and keeping your books.</p>

      <a href="index.html" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:12px;">
        Go to dashboard
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
      <a href="../pricing.html" class="btn btn-secondary" style="width:100%;justify-content:center;">View pricing plans</a>
    </div>
  </div>
</body>
</html>
