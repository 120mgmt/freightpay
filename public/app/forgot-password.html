<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — LedgerHaul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,211,159,0.1) 0%, transparent 60%), var(--bg); }
  </style>
</head>
<body>
  <div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:32px;">
      <a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul" style="height:36px;width:auto;margin:0 auto;"></a>
    </div>

    <div class="panel">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="width:52px;height:52px;background:rgba(56,211,159,0.1);border:1px solid rgba(56,211,159,0.25);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--green);">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h2 style="font-size:22px;font-weight:700;color:#FFF;margin-bottom:8px;">Reset your password</h2>
        <p style="font-size:14px;color:var(--text-muted);">Enter your email and we'll send a reset link.</p>
      </div>

      <div id="errorMsg" style="display:none;" class="alert alert-error" style="margin-bottom:16px;"></div>
      <div id="successMsg" style="display:none;" class="alert alert-ok" style="margin-bottom:16px;"></div>

      <form id="forgotForm" style="display:flex;flex-direction:column;gap:18px;">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;justify-content:center;min-height:48px;">Send reset link</button>
      </form>
    </div>

    <p style="text-align:center;font-size:14px;color:var(--text-muted);margin-top:20px;">
      <a href="login.html" style="color:var(--green);font-weight:500;">← Back to sign in</a>
    </p>
  </div>

<script>
  const API_BASE = (window.LH_CONFIG && window.LH_CONFIG.apiBase) ? window.LH_CONFIG.apiBase : '';

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Sending…';

    try {
      const res = await fetch(API_BASE + '/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = 'check-email.html';
      } else {
        errorMsg.style.display = 'flex';
        errorMsg.textContent = data.message || 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    } catch {
      errorMsg.style.display = 'flex';
      errorMsg.textContent = 'Unable to connect. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
