<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contractors — LedgerHaul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .app-shell { display: flex; flex: 1; min-height: 0; }
    .main-content { flex: 1; overflow-y: auto; padding: 32px; }
    .sidebar-mobile-toggle { display: none; }
    .sidebar-mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: -260px; top: 0; z-index: 50; height: 100vh; transition: left 0.3s ease; }
      .sidebar.open { left: 0; }
      .sidebar-mobile-overlay.active { display: block; }
      .sidebar-mobile-toggle { display: flex; }
      .main-content { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="app-topbar">
  <button class="sidebar-mobile-toggle btn btn-icon btn-ghost" onclick="toggleSidebar()">
    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul" style="height:32px;width:auto;"></a>
  <div class="app-topbar-title" style="margin-left:16px;">Contractors</div>
  <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
    <span id="userEmail" style="font-size:13px;color:var(--text-muted);"></span>
    <button onclick="logout()" class="btn btn-sm btn-ghost">Sign out</button>
  </div>
</div>

<div class="sidebar-mobile-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app-shell">
  <aside class="sidebar scroll-area" id="sidebar">
    <div class="sidebar-logo hide-mobile"><a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul"></a></div>
    <div class="sidebar-section">Main</div>
    <a href="index.html" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="contractors.html" class="sidebar-link active"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Contractors</a>
    <a href="payments.html" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Payments</a>
    <a href="bookkeeping.html" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Bookkeeping</a>
    <div class="sidebar-section">Reports</div>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>P&amp;L Report</a>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Cost per Mile</a>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>Tax Export</a>
    <div class="sidebar-section">Account</div>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  </aside>

  <main class="main-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:22px;font-weight:700;color:#FFF;margin-bottom:2px;">Contractors</h1>
        <p style="font-size:14px;color:var(--text-muted);">Manage drivers and contractor records.</p>
      </div>
      <button onclick="showAddModal()" class="btn btn-primary">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Add contractor
      </button>
    </div>

    <!-- Search / filter bar -->
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
      <div class="field" style="flex:1;min-width:200px;gap:0;">
        <input type="search" id="searchInput" placeholder="Search by name, ID, or pay type…" oninput="filterContractors()" style="border-radius:var(--radius-sm);">
      </div>
      <select id="statusFilter" onchange="filterContractors()" style="background:var(--bg-input);border:1px solid #2A3A52;border-radius:var(--radius-sm);color:var(--text);padding:0 14px;font-size:14px;min-height:48px;appearance:none;min-width:140px;">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <!-- Table -->
    <div class="panel" style="padding:0;">
      <div id="contractorsTable">
        <div class="loader" style="padding:40px;"><span class="loader-spin"></span> Loading contractors…</div>
      </div>
    </div>
  </main>
</div>

<!-- Add Contractor Modal -->
<div id="addModal" style="display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);">
  <div class="panel" style="width:100%;max-width:480px;margin:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h3 style="font-size:18px;font-weight:700;color:#FFF;">Add contractor</h3>
      <button onclick="hideAddModal()" class="btn btn-icon btn-ghost">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="addError" style="display:none;" class="alert alert-error" style="margin-bottom:16px;"></div>

    <form id="addContractorForm" style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field"><label for="cFirstName">First name</label><input type="text" id="cFirstName" required></div>
        <div class="field"><label for="cLastName">Last name</label><input type="text" id="cLastName" required></div>
      </div>
      <div class="field"><label for="cEmail">Email</label><input type="email" id="cEmail" required></div>
      <div class="field">
        <label for="cPayType">Pay type</label>
        <select id="cPayType" style="background:var(--bg-input);border:1px solid #2A3A52;border-radius:14px;min-height:48px;padding:12px 14px;color:var(--text);">
          <option value="per_mile">Per mile</option>
          <option value="per_load">Per load</option>
          <option value="percentage">Percentage</option>
          <option value="flat_rate">Flat rate</option>
          <option value="salary">Salary</option>
        </select>
      </div>
      <div class="field"><label for="cRate">Rate</label><input type="number" id="cRate" step="0.01" placeholder="e.g. 0.55" required></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button type="button" onclick="hideAddModal()" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="addSubmitBtn" class="btn btn-primary">Add contractor</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_BASE = (window.LH_CONFIG && window.LH_CONFIG.apiBase) ? window.LH_CONFIG.apiBase : '';
  let allContractors = [];

  function getToken() { return localStorage.getItem('lh_token'); }
  function logout() { localStorage.removeItem('lh_token'); window.location.href = 'login.html'; }
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('active'); }

  async function apiGet(path) {
    const r = await fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (r.status === 401) { logout(); return null; }
    return r.ok ? r.json() : null;
  }

  function showAddModal() { document.getElementById('addModal').style.display = 'flex'; }
  function hideAddModal() { document.getElementById('addModal').style.display = 'none'; }

  function filterContractors() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allContractors.filter(c => {
      const name = ((c.first_name || '') + ' ' + (c.last_name || '') + ' ' + (c.id || '')).toLowerCase();
      const matchQ = !q || name.includes(q) || (c.pay_type || '').toLowerCase().includes(q);
      const matchStatus = !status || (c.status || 'active') === status;
      return matchQ && matchStatus;
    });
    renderTable(filtered);
  }

  function renderTable(contractors) {
    const el = document.getElementById('contractorsTable');
    if (!contractors || contractors.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div><h3>No contractors yet</h3><p>Add your first contractor to get started.</p><button onclick="showAddModal()" class="btn btn-primary btn-sm" style="margin-top:12px;">Add contractor</button></div>';
      return;
    }
    let html = '<div class="table-wrap" style="border:none;border-radius:0;"><table class="data-table"><thead><tr><th>Name</th><th>ID</th><th>Pay type</th><th>Rate</th><th>Status</th><th></th></tr></thead><tbody>';
    contractors.forEach(c => {
      const status = c.status || 'active';
      const statusClass = status === 'active' ? 'pill-ok' : 'pill-neutral';
      html += `<tr>
        <td><div style="font-weight:500;color:#FFF;">${c.first_name || ''} ${c.last_name || ''}</div><div style="font-size:12px;color:var(--text-subtle);">${c.email || ''}</div></td>
        <td class="col-mono">${c.id || '—'}</td>
        <td><span class="pill pill-neutral">${(c.pay_type || '—').replace('_',' ')}</span></td>
        <td class="col-mono">$${c.rate || '—'}</td>
        <td><span class="pill ${statusClass}">${status}</span></td>
        <td><button class="btn btn-sm btn-ghost" onclick="viewContractor('${c.id}')">View</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
  }

  async function loadContractors() {
    const data = await apiGet('/contractors/');
    allContractors = data || [];
    renderTable(allContractors);
  }

  document.getElementById('addContractorForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('addSubmitBtn');
    const err = document.getElementById('addError');
    err.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Adding…';

    try {
      const res = await fetch(API_BASE + '/contractors/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
        body: JSON.stringify({
          first_name: document.getElementById('cFirstName').value,
          last_name: document.getElementById('cLastName').value,
          email: document.getElementById('cEmail').value,
          pay_type: document.getElementById('cPayType').value,
          rate: parseFloat(document.getElementById('cRate').value)
        })
      });
      const data = await res.json();
      if (res.ok) {
        hideAddModal();
        loadContractors();
        document.getElementById('addContractorForm').reset();
      } else {
        err.style.display = 'flex';
        err.textContent = data.message || 'Failed to add contractor.';
      }
    } catch {
      err.style.display = 'flex';
      err.textContent = 'Unable to connect.';
    }
    btn.disabled = false;
    btn.textContent = 'Add contractor';
  });

  function viewContractor(id) { window.location.href = 'contractors.html?id=' + id; }

  async function init() {
    if (!getToken()) { window.location.href = 'login.html'; return; }
    const me = await apiGet('/auth/me');
    if (me) document.getElementById('userEmail').textContent = me.email || '';
    loadContractors();
  }

  init();
</script>
</body>
</html>
