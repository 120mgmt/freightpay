<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeping — LedgerHaul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .app-shell { display: flex; flex: 1; min-height: 0; }
    .main-content { flex: 1; overflow-y: auto; padding: 32px; }
    .sidebar-mobile-toggle { display: none; }
    .sidebar-mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; }
    .tab-btn { padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); background: none; border: none; cursor: pointer; transition: background var(--transition), color var(--transition); }
    .tab-btn.active { background: rgba(56,211,159,0.12); color: var(--green); }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: -260px; top: 0; z-index: 50; height: 100vh; transition: left 0.3s ease; }
      .sidebar.open { left: 0; }
      .sidebar-mobile-overlay.active { display: block; }
      .sidebar-mobile-toggle { display: flex; }
      .main-content { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="app-topbar">
  <button class="sidebar-mobile-toggle btn btn-icon btn-ghost" onclick="toggleSidebar()">
    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul" style="height:32px;width:auto;"></a>
  <div class="app-topbar-title" style="margin-left:16px;">Bookkeeping</div>
  <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
    <span id="userEmail" style="font-size:13px;color:var(--text-muted);"></span>
    <button onclick="logout()" class="btn btn-sm btn-ghost">Sign out</button>
  </div>
</div>

<div class="sidebar-mobile-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app-shell">
  <aside class="sidebar scroll-area" id="sidebar">
    <div class="sidebar-logo hide-mobile"><a href="/"><img src="../assets/images/logo.png" alt="LedgerHaul"></a></div>
    <div class="sidebar-section">Main</div>
    <a href="index.html" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="contractors.html" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Contractors</a>
    <a href="payments.html" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Payments</a>
    <a href="bookkeeping.html" class="sidebar-link active"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Bookkeeping</a>
    <div class="sidebar-section">Reports</div>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>P&amp;L Report</a>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Cost per Mile</a>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>Tax Export</a>
    <div class="sidebar-section">Account</div>
    <a href="#" class="sidebar-link"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>Settings</a>
  </aside>

  <main class="main-content">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:22px;font-weight:700;color:#FFF;margin-bottom:2px;">Bookkeeping</h1>
        <p style="font-size:14px;color:var(--text-muted);">General ledger, P&amp;L, and balance sheet.</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button onclick="exportQbo()" class="btn btn-sm btn-secondary">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          QuickBooks CSV
        </button>
        <button onclick="exportCsv()" class="btn btn-sm btn-secondary">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Export CSV
        </button>
      </div>
    </div>

    <!-- Summary Cards -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;" id="summaryGrid">
      <div class="metric-card">
        <div class="metric-label">Total Revenue</div>
        <div class="metric-value" id="sumRevenue">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Expenses</div>
        <div class="metric-value" id="sumExpenses">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Net Income</div>
        <div class="metric-value" id="sumNet">—</div>
        <div id="netStatus" style="margin-top:4px;"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content;">
      <button class="tab-btn active" onclick="switchTab('ledger',this)">General Ledger</button>
      <button class="tab-btn" onclick="switchTab('pl',this)">P&amp;L</button>
      <button class="tab-btn" onclick="switchTab('balance',this)">Balance Sheet</button>
    </div>

    <!-- General Ledger Tab -->
    <div class="tab-content active" id="tab-ledger">
      <div class="panel" style="padding:0;">
        <div id="ledgerTable">
          <div class="loader" style="padding:40px;"><span class="loader-spin"></span> Loading ledger…</div>
        </div>
      </div>
    </div>

    <!-- P&L Tab -->
    <div class="tab-content" id="tab-pl">
      <div class="panel">
        <div id="plContent">
          <div class="loader"><span class="loader-spin"></span> Loading P&amp;L…</div>
        </div>
      </div>
    </div>

    <!-- Balance Sheet Tab -->
    <div class="tab-content" id="tab-balance">
      <div class="panel">
        <div id="balanceContent">
          <div class="loader"><span class="loader-spin"></span> Loading balance sheet…</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const API_BASE = (window.LH_CONFIG && window.LH_CONFIG.apiBase) ? window.LH_CONFIG.apiBase : '';
  function getToken() { return sessionStorage.getItem('lh_token') || localStorage.getItem('lh_token'); }
  function logout() { sessionStorage.removeItem('lh_token'); sessionStorage.removeItem('lh_refresh_token'); localStorage.removeItem('lh_token'); window.location.href = 'login.html'; }
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('active'); }

  function fmt(n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(n || 0); }

  async function apiGet(path) {
    const r = await fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (r.status === 401) { logout(); return null; }
    return r.ok ? r.json() : null;
  }

  function switchTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
  }

  async function loadBookkeeping() {
    // Summary
    const summary = await apiGet('/bookkeeping/summary');
    if (summary) {
      const net = (summary.total_revenue || 0) - (summary.total_expenses || 0);
      document.getElementById('sumRevenue').textContent = fmt(summary.total_revenue || 0);
      document.getElementById('sumExpenses').textContent = fmt(summary.total_expenses || 0);
      document.getElementById('sumNet').textContent = fmt(net);
      const ns = document.getElementById('netStatus');
      ns.innerHTML = net >= 0 ? '<span class="pill pill-ok">Profit</span>' : '<span class="pill pill-error">Loss</span>';
    }

    // Ledger entries
    const entries = await apiGet('/bookkeeping/entries');
    const ledgerEl = document.getElementById('ledgerTable');
    if (entries && entries.length > 0) {
      let html = '<div class="table-wrap" style="border:none;border-radius:0;"><table class="data-table"><thead><tr><th>Date</th><th>Description</th><th>Account</th><th>Debit</th><th>Credit</th><th>Ref</th></tr></thead><tbody>';
      entries.forEach(e => {
        html += `<tr>
          <td style="font-size:12px;color:var(--text-muted);">${e.date ? new Date(e.date).toLocaleDateString() : '—'}</td>
          <td>${e.description || e.memo || '—'}</td>
          <td style="font-size:13px;color:var(--text-muted);">${e.account || '—'}</td>
          <td class="col-mono" style="color:${e.debit ? 'var(--ok-fg)' : 'var(--text-subtle)'};">${e.debit ? fmt(e.debit) : '—'}</td>
          <td class="col-mono" style="color:${e.credit ? 'var(--err-fg)' : 'var(--text-subtle)'};">${e.credit ? fmt(e.credit) : '—'}</td>
          <td class="col-mono" style="font-size:11px;">${e.reference || e.run_id || '—'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
      ledgerEl.innerHTML = html;
    } else {
      ledgerEl.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div><h3>No ledger entries</h3><p>Run a payroll to automatically generate journal entries.</p></div>';
    }

    // P&L
    const pl = await apiGet('/bookkeeping/pl');
    const plEl = document.getElementById('plContent');
    if (pl) {
      plEl.innerHTML = `<div style="max-width:480px;">
        <div style="font-size:16px;font-weight:600;color:#FFF;margin-bottom:16px;">Profit &amp; Loss</div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-muted);font-size:14px;">
          <span style="color:var(--text-muted);">Revenue</span><span style="color:var(--ok-fg);font-weight:600;font-family:monospace;">${fmt(pl.revenue || pl.total_revenue || 0)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-muted);font-size:14px;">
          <span style="color:var(--text-muted);">Payroll expenses</span><span style="color:var(--err-fg);font-family:monospace;">-${fmt(pl.payroll_expense || 0)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-muted);font-size:14px;">
          <span style="color:var(--text-muted);">Fuel expenses</span><span style="color:var(--err-fg);font-family:monospace;">-${fmt(pl.fuel_expense || 0)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:16px 0;font-size:15px;font-weight:700;">
          <span style="color:#FFF;">Net income</span><span style="color:#FFF;font-family:monospace;">${fmt(pl.net_income || 0)}</span>
        </div>
      </div>`;
    } else {
      plEl.innerHTML = '<div class="empty-state"><h3>P&amp;L unavailable</h3><p>Run payroll to generate your profit &amp; loss report.</p></div>';
    }

    // Balance Sheet
    const bs = await apiGet('/bookkeeping/balance-sheet');
    const bsEl = document.getElementById('balanceContent');
    if (bs) {
      bsEl.innerHTML = `<div style="max-width:480px;">
        <div style="font-size:16px;font-weight:600;color:#FFF;margin-bottom:16px;">Balance Sheet</div>
        <div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-subtle);margin-bottom:12px;">Assets</div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-muted);font-size:14px;">
          <span style="color:var(--text-muted);">Cash (Operating)</span><span style="font-family:monospace;">${fmt(bs.cash || 0)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;">
          <span style="color:var(--text-muted);">Accounts receivable</span><span style="font-family:monospace;">${fmt(bs.accounts_receivable || 0)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;font-size:14px;font-weight:600;">
          <span>Total assets</span><span style="font-family:monospace;">${fmt((bs.cash || 0) + (bs.accounts_receivable || 0))}</span>
        </div>
        <div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-subtle);margin:16px 0 12px;">Liabilities</div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-muted);font-size:14px;">
          <span style="color:var(--text-muted);">Accounts payable</span><span style="font-family:monospace;">${fmt(bs.accounts_payable || 0)}</span>
        </div>
      </div>`;
    } else {
      bsEl.innerHTML = '<div class="empty-state"><h3>Balance sheet unavailable</h3><p>Financial data will appear here after transactions are recorded.</p></div>';
    }
  }

  async function exportCsv() {
    const r = await fetch(API_BASE + '/bookkeeping/export/csv', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (!r.ok) return;
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'ledger.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  async function exportQbo() {
    const r = await fetch(API_BASE + '/bookkeeping/export/quickbooks', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (!r.ok) return;
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'ledger_quickbooks.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  async function init() {
    if (!getToken()) { window.location.href = 'login.html'; return; }
    const me = await apiGet('/auth/me');
    if (me) document.getElementById('userEmail').textContent = me.email || '';
    loadBookkeeping();
  }

  init();
</script>
<style>
  @media (max-width: 680px) {
    #summaryGrid { grid-template-columns: 1fr !important; }
  }
</style>
</body>
</html>
